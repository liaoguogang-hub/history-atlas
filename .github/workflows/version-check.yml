name: 版本与内容校验

# 这个工作流的作用是「挡住没升版本的改动」。
# 规则：只要 main 分支上有提交领先于最新的版本 tag，
# 就说明有代码或数据改了但没发版——CI 失败，逼着补发一个版本。
#
# 之所以不直接在 push 时构建 APK：APK 体积大、构建慢，
# 发版由 tools/release.py 统一负责，CI 只做守门。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check-version:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史才能比较 tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查版本号、CHANGELOG、tag、Release 资产是否一致
        run: python tools/check_version.py

      - name: 检查是否有未发布的改动
        run: |
          set -e
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$LATEST_TAG" ]; then
            echo "没有任何版本 tag"
            exit 1
          fi
          echo "最新版本 tag：$LATEST_TAG"
          AHEAD=$(git rev-list --count "$LATEST_TAG"..HEAD)
          echo "领先该 tag 的提交数：$AHEAD"
          if [ "$AHEAD" -gt 0 ]; then
            echo ""
            echo "::error::有 $AHEAD 个提交尚未发布。"
            echo "内容有变更就必须升版本号并发版："
            echo "  python tools/release.py <新版本号>"
            echo "详见 CHANGELOG.md 开头的「版本管理约定」。"
            git log --oneline "$LATEST_TAG"..HEAD
            exit 1
          fi
          echo "所有提交均已包含在版本 tag 中"

  build:
    name: 构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备 SDK 路径
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" >> history-atlas/local.properties

      # 这里只校验数据。版本一致性由上面的 check-version 作业独占，
      # 不在本作业重复执行 check_version.py，原因有二：
      #   1. 本作业的 checkout 是默认浅克隆，拿不到任何 tag，
      #      「当前版本已打 tag」这一项必然误报「尚未打 tag」
      #   2. 「Release 资产」检查依赖 gh 的登录态，本作业没有 GH_TOKEN，
      #      调用只会静默降级成一条误导性的警告
      - name: 校验数据
        run: python tools/build_data.py

      - name: 构建 release APK
        working-directory: history-atlas
        run: ./gradlew :app:assembleRelease

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: HistoryAtlas-apk
          path: history-atlas/dist/*.apk
          if-no-files-found: error
